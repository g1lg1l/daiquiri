name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budgets (docs/architecture/performance.md)
        run: pnpm --filter @daiq/web size

  database:
    name: Database (pgTAP, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Start Supabase
        # auth and realtime create schemas our migrations extend; the rest is not needed.
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta,storage-api,kong,postgrest
      - run: supabase db lint --local --level error --fail-on error
      - run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > /tmp/types.ts
          npx --yes prettier@3 --stdin-filepath packages/data/src/database.types.ts < /tmp/types.ts > /tmp/types.formatted.ts
          diff -u packages/data/src/database.types.ts /tmp/types.formatted.ts

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,storage-api,mailpit
      - name: Install browsers
        run: pnpm --filter @daiq/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/migrate/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Compose file is valid
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml --env-file docker/.env config --quiet
